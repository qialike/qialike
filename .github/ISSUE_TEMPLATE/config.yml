blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/qialike/qialike/security/advisories/new
    about: Private channel. Sandbox escapes, approval bypasses, credential leaks and plugin-trust problems belong here, never in a public issue.
  - name: Question, or how do I do X
    url: https://github.com/qialike/qialike/discussions
    about: Usage questions are better answered in Discussions than in the issue tracker.
  - name: Read the manual first
    url: https://github.com/qialike/qialike/blob/main/README.md
    about: Install, security boundaries, providers, updates and troubleshooting are all documented.
