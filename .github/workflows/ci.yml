# Continuous integration for qialike.
#
# WHAT THIS GATE IS. It is the automatable half of the release gate: typecheck,
# the unit suite, the single-file build, and the keyless composition smoke test.
# The half it CANNOT replace is the real-machine pty suite, which lives outside
# the repo (`~/deepseek/cli-test/`, driven by its `release-check.sh`): it needs
# a real TTY and takes ~17 minutes per scenario, so it stays a local, pre-tag
# step. Nothing here means "shippable" on its own.
#
# WHY THE HARNESS CHECKOUT IS A WHOLE LEG. qialike deliberately never forks
# deepseek-harness: "DeepSeek Harness core source is zero-modified" is the
# project's first rule. So the build reads each harness package's built `lib/`
# out of a checkout, gates on the version range in `apps/tui-bin/build.mjs`
# (currently `0.1.0-rc.7 .. 0.2.0-rc.2`), and asserts its anchored patches
# against that checkout's compiled output. A harness that moved an anchor fails
# the build loudly — which is the point, and is exactly what this leg buys.
#
# WHEN RAISING HARNESS_VERSION_MAX: pin `HARNESS_REF` below to the same release
# and re-run this workflow before touching the constant. The two drifting apart
# is the failure mode this leg exists to catch, and it has happened: the 0.1.5
# -> 0.1.7 upgrade broke seven classes of incompatibility (see CHANGELOG).
#
# COST. The harness monorepo leg dominates (~56 packages, its own pnpm install
# and tsdown build). If it proves too slow for every PR, move `build-and-test` to
# a nightly `schedule:` and keep `hygiene` — which is hermetic and takes seconds —
# as the per-PR check. Both are wired below; pick per taste.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Uncomment to run the heavy leg nightly instead of on every PR.
  # schedule:
  #   - cron: '0 3 * * *'

permissions:
  contents: read

env:
  # The harness release this build is validated against; keep in sync with
  # HARNESS_VERSION_MAX in apps/tui-bin/build.mjs.
  HARNESS_REF: dsh-v0.2.0-rc.2

jobs:
  # Fast, hermetic guards: they read the repository, never the harness, so they
  # are the right thing to fail a PR on in seconds.
  hygiene:
    name: Hygiene guards (hermetic)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      # NOTE: there is deliberately no separate "product identity" step here any more.
      # It used to run `tests/rename-hygiene.test.ts`, which `ffba71f` deleted together
      # with the `dsh-tui` compatibility layer it guarded — leaving this job invoking a
      # file that no longer exists, so `bun test <missing path>` exited 1 and the job was
      # red for reasons unrelated to the code under test. The little that is still
      # worth asserting about the old spelling lives in `tests/install-script.test.ts`.

      # `release-consistency` compares `HARNESS_REF` above with the range the
      # build enforces, and the three package.json versions with each other. Run
      # it HERE, before the expensive leg: it is the one guard that can prove the
      # expensive leg is about to validate the right thing.
      - name: Release consistency guards
        run: bun test tests/release-consistency.test.ts

  build-and-test:
    name: Typecheck, unit suite, build, smoke
    runs-on: ubuntu-24.04
    # Kept out of `hygiene` because it clones and builds the whole harness.
    timeout-minutes: 60
    # The harness lives at a SIBLING of the checkout, and that layout is load-bearing
    # rather than incidental: `tsconfig.typecheck.json`'s 22 `paths` entries resolve
    # `@deepseek-ai/*` to `<repo>/../deepseek-harness/**/lib/types/*.d.ts`, and
    # `apps/tui-bin/build.mjs` defaults `DSH_HARNESS` to the same place. Cloning it
    # anywhere else (this used to be `$RUNNER_TEMP`) leaves every one of those paths
    # dangling, and the typecheck then reports `Cannot find module '@deepseek-ai/cordis'`
    # in files that are perfectly fine — which is exactly what a green gate must not do.
    # Being a sibling also keeps it OUTSIDE the qialike tree, which several tests that
    # walk the repository depend on.
    env:
      DSH_HARNESS: ${{ github.workspace }}/../deepseek-harness
    steps:
      - name: Checkout qialike
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      # The build refuses a bun older than 1.4.2 (BUN_VERSION_MIN): the runtime
      # is baked into every artifact, and 1.3.x builds produce a Windows binary
      # that ends every turn before the first model call.
      - name: Assert the toolchain floor
        run: |
          node --version
          bun --version

      - name: Cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Enable pnpm
        run: corepack enable

      - name: Activate pnpm from the lockfile
        run: corepack prepare pnpm@11.7.0 --activate

      # --- the harness checkout ------------------------------------------------
      # Cloned to the sibling path the job env names, because `tsconfig.typecheck.json`
      # resolves through it (see the comment on that env). It is outside the qialike
      # tree on purpose: several tests walk the repository, and a second monorepo
      # inside it would be both slow and a false-positive source.
      - name: Checkout deepseek-harness at the pinned release
        run: |
          git clone --filter=blob:none --depth 1 --branch "$HARNESS_REF" \
            https://github.com/deepseek-ai/deepseek-harness.git \
            "$DSH_HARNESS"

      - name: Build deepseek-harness
        # `cd` rather than `working-directory:` because that field cannot read `env`,
        # and the sibling path should be written in exactly one place (the job env).
        run: |
          cd "$DSH_HARNESS"
          # `--frozen-lockfile` because an upstream lockfile drift is a fact we want
          # to see, not something to resolve silently inside CI.
          pnpm install --frozen-lockfile
          pnpm run build

      # --- qialike -------------------------------------------------------------
      - name: Install qialike
        run: pnpm install --frozen-lockfile

      # The typecheck reads TWO build artifacts, and this step is the cheap way to
      # create both (seconds, no compile: `--generate-only` leaves `dist/` and the
      # sidebar build channel alone):
      #   · the resolution farm `node_modules/@deepseek-ai/*` → `apps/tui-bin/x/`
      #     (gitignored, so a fresh checkout has none of it);
      #   · `node_modules/wrap-ansi`, which `build.mjs` mirrors in from the harness
      #     store and which `package.json` never declares — without it the three
      #     known declarations errors change shape and read as code failures.
      # The policy lives in `scripts/release/typecheck.sh`, shared with the release
      # gate, so "what counts as passing" is written once.
      - name: Create the resolve farm
        run: node apps/tui-bin/build.mjs --generate-only

      - name: Typecheck
        run: bash scripts/release/typecheck.sh

      # The full build also creates the resolution farm the unit suite imports through
      # (`node_modules/@deepseek-ai/*`), so it has to precede the tests — not just
      # the smoke test.
      - name: Build the single-file binary
        run: pnpm run build

      - name: Unit suite
        run: pnpm run test:unit

      # Boots the real dsh-base + qialike-app composition inside the packaged
      # binary and parses the TUI command surface. Keyless by design.
      - name: Composition smoke test
        run: pnpm test

      - name: Binary self-report
        run: ./dist/qialike --version
