# The dsh-tui-app bundle patch: a full-screen Ink/React terminal surface over
# the dsh-base layer. Applied after dsh-base's insert; rows here override base
# rows by id, with the profile's own cordis.patch.yml and any --patch overlays
# still to come.
#
# This surface is single-session and composes its agent process-wide, so the
# base rows the Web surface moves behind agent presets stay mounted here (the
# base bundle deliberately keeps them for the TUI). The OS-process sandbox is
# used, running bwrap (Linux) / Seatbelt (macOS) / ACL (Windows) — the
# Linux-only landlock native addon is not bundle-able in the SEA single file,
# so it is stubbed to `unusable` and the sandbox falls to bwrap. The file-effect
# boundary is additionally fenced by the sandbox-policy (workspace-write), the
# approval flow (ask), and the permission presets.

# ── surface-specific values the base deliberately omits ─────────────────────

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# The shared module-reload HMR row stays off; the launcher's watch-only
# fallback keeps user patch layers live until exit.
- id: hmr
  disabled: true

- id: tools
  config:
    # Keep the same temporary process-wide Code Mode opt-in as the other
    # surfaces. Unset keeps the schema default (native).
    mode: !!js process.env.DSH_TOOLS_MODE

# The web surface groups sessions under a Workspace (workspaceId); the TUI
# profile does not mount the Workspace registry by default, so dsh-tui sessions
# (created with `meta.cwd` only) have no workspaceId and the web lists them as
# "Ungrouped". Mount the same workspace registry here so dsh-tui can attach its
# sessions to the workspace that owns its cwd (see tui-runtime establish()).
- insert:
    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

# `@file` references (composer `@` completion). The web bundle mounts this row
# itself (packages/bundle/web-app/cordis.patch.yml); the TUI profile has to ask
# for it, otherwise `ctx.fileReferences` does not exist and the composer's `@`
# palette has nothing to search with. It provides the host-side candidate search
# (`WorkspaceFileSearch`: 20 rows per query, 50k indexed entries, fixed
# directory excludes — no .gitignore semantics) AND installs the model-facing
# `FILE_REFERENCE_PROMPT` section on each agent that has the `read` tool, so the
# `@path` text the composer inserts is understood exactly as it is in the web UI.
- insert:
    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'

# The `@file` palette itself: a child plugin of THIS bundle. It owns an overlay
# panel (`file-refs`) and the `@`-token detection, and searches through the
# `fileReferences` row above; the conversation panel needs no knowledge of it.
- insert:
    - id: tui-file-reference
      name: '@yourname/dsh-tui-app/file-reference'

# ── OS-level sandbox: bwrap (Linux) / Seatbelt (macOS) / ACL (Windows) ──────
#
# The SEA single file cannot bundle the Linux-only landlock native addon, so
# `node-addon-landlock-run` is stubbed to report `unusable` (see build.mjs) and
# `dsh-sandbox-local` runs on Linux's **bwrap** rung, macOS's built-in seatbelt
# rung, or the Windows ACL restricted-token runner — real OS process isolation
# without a native addon. The file-effect boundary still holds: sandbox-policy
# (workspace-write), approval (ask), permission presets, and
# fs-observation-policy stay enabled. Bash now runs via the confined executor,
# so each bash call is wrapped through `ctx.sandbox.confine()`.

- id: sandbox

# The permission presets row is sandbox-coupled (it needs a confined bash
# executor), so it is enabled alongside the OS sandbox; the sandbox-POLICY
# service still owns the session `sandbox:mode` that the TUI's Tab switch
# writes, feeding the sandbox_permissions + approval escalation path.
# On Windows the SEA single file cannot embed the native ACL restricted-token
# runner (build.mjs stubs pwsh-sandbox), so the only mountable executor is the
# unconfined pwsh-local; permission-presets refuses to mount over an
# unconfined executor (its check fails loud), so the row is disabled on
# Windows only. POSIX keeps it enabled over the confined bash-sandbox rung.
- id: permission
  disabled: !!js process.platform === 'win32'

- id: bash-sandbox
  config:
    timeoutMs: 60000

- id: pwsh-sandbox
  disabled: true

# Windows `ctx.shell` executor. The base pwsh-sandbox row this surface disables
# above is the native ACL restricted-token runner, which a single-file SEA
# cannot bundle (build.mjs stubs the module); without any executor the
# pwsh tool row and permission-presets row stay pending on `shell` and boot
# fails the activation audit. Windows still needs one shell executor, so mount
# the non-native pwsh-local provider on Windows only, mirroring the base
# bundle's per-platform bash/pwsh pairing (POSIX keeps bash-sandbox).
- insert:
    - id: pwsh-local
      name: '@deepseek-ai/dsh-pwsh-local'
      disabled: !!js process.platform !== 'win32'

# fs-sandbox is the PURE-JS file-policy fence (no native addon): write/edit/
# delete tools consult the session sandbox-policy mode and deny mutations in
# `read-only`, restrict to the workspace root in `workspace-write`, and
# delegate unfenced in `danger-full-access`. It provides `ctx.fs` (extends
# dsh-fs-local), so no separate local fs provider is inserted.
- id: fs-sandbox
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? 'workspace-write'

- insert:
    # Gives the model the `ask_user_question` tool, which asks the user for a
    # decision (e.g. which language). The TUI registers a UserQuestionProvider
    # that renders the question and returns the choice; without this row the
    # model has no way to ask and would pick a default silently.
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

    # Reads its cli flags, then drives the long-lived terminal session.
    - id: tui-startup
      name: '@yourname/dsh-tui-app/startup'

    # /models capability: provider enumeration + "Add provider" writes. The
    # self-hosted OpenAI-compatible provider layer (`tui-llm`) replaces the
    # base composition's pi-ai twin and the deepseek adapter; both are
    # disabled below.
    - id: tui-llm
      name: '@yourname/dsh-tui-app/llm'

    # OpenCode Zen / OpenCode Go gateway templates (loadable): registers the
    # two gateway providers through tui-llm's `tuiLlmTemplates` extension
    # point; `dsh-tui-opencode.enabled: false` in settings unloads them.
    - id: tui-opencode-gateways
      name: '@yourname/dsh-tui-app/opencode'

    # China multi-model gateways (loadable): Qiniu (qiniu-ai) and SiliconFlow
    # (siliconflow / siliconflow-cn) aggregate many vendors' models, so they
    # are registered through `tuiLlmTemplates` instead of the built-in
    # catalog; `dsh-tui-china-gateways.enabled: false` in settings unloads them.
    - id: tui-china-gateways
      name: '@yourname/dsh-tui-app/china-gateways'

    # Foreign multi-model gateways / hosting platforms (loadable): OpenRouter,
    # Vercel/Cloudflare gateways, Hugging Face, Baseten, Fireworks, Together,
    # Nvidia, Groq, Cerebras — registered through `tuiLlmTemplates`;
    # `dsh-tui-foreign-gateways.enabled: false` unloads them all.
    - id: tui-foreign-gateways
      name: '@yourname/dsh-tui-app/foreign-gateways'

    # Azure provider (loadable, deployment-configured): registers the Azure
    # catalog row (models.dev `azure`) through `tuiLlmTemplates`;
    # `dsh-tui-azure.enabled: false` unloads it.
    - id: tui-azure
      name: '@yourname/dsh-tui-app/azure'

    # Color scheme (loadable, vim-style `:colorscheme`): built-in + user
    # ~/.dsh/themes/*.json palettes; /theme switches live and persists.
    - id: tui-theme
      name: '@yourname/dsh-tui-app/theme-plugin'

    # Steps sidebar visibility: `/sidebar` command (+ click on the Steps title
    # band) toggles the right panel between auto/on/off; the choice persists in
    # dsh-tui.json.
    - id: tui-sidebar-toggle
      name: '@yourname/dsh-tui-app/sidebar-toggle'


    - id: tui-models
      name: '@yourname/dsh-tui-app/models'

    - id: tui-runtime
      name: '@yourname/dsh-tui-app'
      inject: [tuiStartup, tuiModels]
      config:
        workspace: !!js ctx.tuiStartup.workspace
        resume: !!js ctx.tuiStartup.resume
        resumeNewest: !!js ctx.tuiStartup.resumeNewest
        model: !!js ctx.tuiStartup.model

    # ── surface panels (plugins; register against the `tui` service) ────────
    - id: tui-panel-conversation
      name: '@yourname/dsh-tui-app/panels-conversation'

    - id: tui-panel-approval
      name: '@yourname/dsh-tui-app/panels-approval'

    - id: tui-panel-question
      name: '@yourname/dsh-tui-app/panels-question'

    - id: tui-panel-models
      name: '@yourname/dsh-tui-app/panels-models'

    # /sessions dialog: list / search / resume persisted sessions.
    - id: tui-sessions
      name: '@yourname/dsh-tui-app/sessions'

    # /export: session transcript export (JSON / --markdown, --sanitize).
    - id: tui-export
      name: '@yourname/dsh-tui-app/export'

    # /new: start a brand-new session in place; the old
    # session is persisted by the harness and stays resumable.
    - id: tui-new
      name: '@yourname/dsh-tui-app/new'

    # /goal: human command plane over the harness goal domain (the goal
    # service, model tools, and round driver are mounted by the base bundle;
    # only the command reachable from the TUI composer was missing).
    - id: tui-goal
      name: '@yourname/dsh-tui-app/goal'

    # /plan: human command plane over the harness plan-mode service (the
    # plan/mode state, guidance prompt section, and exit_plan_mode review
    # tool are mounted by the base bundle; only the command was missing).
    - id: tui-plan
      name: '@yourname/dsh-tui-app/plan'

    # /selftest: in-process read-only self checks (theme registry, stdin
    # decoder, provider templates, panel/command completeness) + optional
    # `bun test tests/` when a checkout with bun is nearby.
    - id: tui-selftest
      name: '@yourname/dsh-tui-app/selftest'

    # Image drag-in: detects a dragged image file (the terminal pastes its path),
    # reads + saves it through the attachment store, and presents a composer
    # [Image: name] chip; submit emits an image content block.
    - id: tui-image-attach
      name: '@yourname/dsh-tui-app/image-attach'

# The plugin-package inventory reads every active Loader entry's package.json
# from disk at each model request; inside the single-file SEA there is no
# on-disk node_modules to resolve, so its prepare step rejects every request
# before HTTP (REQUEST_EXTENSION). The field is request-diagnostics only and
# stays outside model input, so the TUI disables it like the native-sandbox rows.
- id: plugin-package-inventory-deepseek
  config:
    enabled: false

# ── self-hosted provider layer replaces pi-ai and the deepseek adapter ──────
#
# `tui-llm` registers its own OpenAI-compatible adapter (built-in DeepSeek
# route + `dsh-tui-llm:` settings section). The base rows these replace are
# disabled so no route is owned twice:
#   - llm-pi-ai:   the pi-ai catalog twin (third-party dependency, dropped)
#   - llm-deepseek: the deepseek adapter (deepseek-official is now provided by
#                   tui-llm, whose routes and models it advertises the same)
- id: llm-pi-ai
  disabled: true

- id: llm-deepseek
  disabled: true
